<!DOCTYPE html>
<html lang="cs" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bufet POS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Přihlášení – Školní Bufet POS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex items-center justify-center bg-slate-100 px-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 sm:p-8 animate-in fade-in zoom-in-95 duration-300">

    <!-- Logo a nadpis -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🏫</div>
      <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Školní Bufet POS</h1>
      <p class="text-slate-500 mt-1 text-sm">Zadej heslo pro přístup k pokladně</p>
    </div>

    <!-- Přihlašovací formulář -->
    <form id="login-form" class="space-y-5" novalidate>

      <!-- Pole pro heslo -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Heslo</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            inputmode="text"
            autocomplete="current-password"
            placeholder="Zadej přístupové heslo"
            required
            class="w-full px-4 py-3.5 text-base sm:text-lg font-mono text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            aria-describedby="password-hint"
          >
          <button
            type="button"
            id="toggle-password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-lg"
            aria-label="Zobrazit/skrýt heslo"
          >
            👁️
          </button>
        </div>
        <p id="password-hint" class="text-[11px] text-slate-400 mt-1.5">Zaměstnanci: heslo pro prodej • Admin: heslo pro správu</p>
      </div>

      <!-- Chybová zpráva -->
      <div id="login-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2">
        <span>⚠️</span>
        <span id="login-error-text"></span>
      </div>

      <!-- Tlačítko přihlášení -->
      <button
        type="submit"
        id="login-btn"
        class="touch-btn w-full py-3.5 bg-slate-900 hover:bg-slate-800 active:bg-slate-700 text-white rounded-xl font-bold text-base sm:text-lg shadow-md shadow-slate-900/20 transition flex items-center justify-center gap-2"
      >
        <span>🔓</span>
        <span>Přihlásit se</span>
      </button>

    </form>

    <!-- Info o verzí -->
    <div class="mt-8 pt-6 border-t border-slate-200 text-center">
      <p class="text-[11px] text-slate-400 font-mono">Školní Bufet POS v1.0</p>
    </div>

  </div>

  <script>
    // ==========================================
    // LOGIN LOGIKA
    // ==========================================

    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const loginBtn = document.getElementById('login-btn');
    const errorDiv = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');

    // Toggle zobrazení hesla
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Submit formuláře
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = passwordInput.value.trim();
      if (!password) {
        showError('Zadej prosím heslo');
        return;
      }

      // Loading stav
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="animate-spin">⏳</span><span>Přihlašuji...</span>';
      hideError();

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Neplatné heslo');
        }

        // Uložení tokenu
        localStorage.setItem('bufet_pos_token', data.token);

        // Úspěch - redirect
        showSuccess('✅ Přihlášení úspěšné, přesouvám...');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);

      } catch (err) {
        showError(err.message);
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>🔓</span><span>Přihlásit se</span>';
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorDiv.classList.remove('hidden');
      passwordInput.classList.add('border-red-400', 'bg-red-50');
      passwordInput.focus();
    }

    function hideError() {
      errorDiv.classList.add('hidden');
      passwordInput.classList.remove('border-red-400', 'bg-red-50');
    }

    function showSuccess(msg) {
      errorText.textContent = msg;
      errorDiv.className = 'p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 text-sm flex items-center gap-2';
      errorDiv.classList.remove('hidden');
    }

    // Fokus na input při načtení
    passwordInput.focus();

    // Enter v inputu = submit
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        form.dispatchEvent(new Event('submit'));
      }
    });
  </script>

</body>
</html>
